<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Check current weather conditions and explore a detailed 5-day forecast with interactive weather charts."
    />

    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />


    <title>Current Weather | Weather App</title>
    <script type="module" crossorigin src="/weather-app/assets/vendor-1EtPX3YI.js"></script>
    <script type="module" crossorigin src="/weather-app/assets/main-Bcp9G1I6.js"></script>
    <link rel="stylesheet" crossorigin href="/weather-app/assets/vendor-DnveWo0P.css">
    <link rel="stylesheet" crossorigin href="/weather-app/assets/main-nZ7bnzKr.css">
  </head>

  <body>
    <header class="header">
      <div class="container">
        <div class="header-wrapper">
          <svg
            class="header-icon-location"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/weather-app/assets/icons-D0JtYWc4.svg#icon-location"></use>
          </svg>

          <input
            class="header-input"
            type="text"
            placeholder="Enter the city"
            aria-label="Enter city name"
            autocomplete="off"
          />

          <svg class="header-icon-star" aria-hidden="true" focusable="false">
            <use href="/weather-app/assets/icons-D0JtYWc4.svg#icon-star"></use>
          </svg>
        </div>
      </div>
    </header>

    <main>
      <section class="home" aria-label="Current weather">
        <div class="container">
          <div class="weather-card"></div>

          <nav class="buttons-wrapper" aria-label="Weather forecast">
            <a class="button" href="./index.html" aria-current="page">
              Today
            </a>

            <a class="button inactive" href="./five-days.html"> 5 days </a>
          </nav>

          <div class="dektop-wrapper">
            <div class="datetime-card"></div>

            <div>
              <blockquote class="home-quote">
                Who cares about the clouds when we're together? Just sing a song
                and bring the sunny weather.
              </blockquote>

              <p class="home-quote-author">Dale Evans</p>
            </div>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
