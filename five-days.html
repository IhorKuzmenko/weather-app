<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Explore a detailed 5-day weather forecast with hourly updates and interactive charts for temperature, humidity, wind speed, and pressure."
    />

    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />


    <title>5-Day Forecast | Weather App</title>
    <script type="module" crossorigin src="/weather-app/assets/vendor-1EtPX3YI.js"></script>
    <script type="module" crossorigin src="/weather-app/assets/main-Dg_ixqy0.js"></script>
    <link rel="stylesheet" crossorigin href="/weather-app/assets/main-B9JDCaJT.css">
    <link rel="stylesheet" crossorigin href="/weather-app/assets/vendor-DnveWo0P.css">
  </head>

  <body class="five-days-body">
    <header class="header">
      <div class="container">
        <div class="header-wrapper">
          <svg
            class="header-icon-location"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/weather-app/assets/icons-D0JtYWc4.svg#icon-location"></use>
          </svg>

          <input
            class="header-input"
            type="text"
            placeholder="Enter the city"
            aria-label="Enter city name"
            autocomplete="off"
          />

          <svg class="header-icon-star" aria-hidden="true" focusable="false">
            <use href="/weather-app/assets/icons-D0JtYWc4.svg#icon-star"></use>
          </svg>
        </div>
      </div>
    </header>

    <main>
      <section class="five-days" aria-label="Five-day weather forecast">
        <div class="container container-desktop-five-days">
          <nav
            class="buttons-wrapper buttons-wrapper-five-days"
            aria-label="Weather forecast"
          >
            <a class="button inactive" href="./index.html"> Today </a>

            <a class="button" href="./five-days.html" aria-current="page">
              5 days
            </a>
          </nav>

          <div class="forecast-container">
            <div class="forecast-city"></div>

            <div class="forecast-5days-wrapper">
              <ul class="forecast-5days"></ul>
            </div>

            <div class="button-container">
              <button
                class="forecast-button-scroll forecast-button-left"
                type="button"
                aria-label="Scroll forecast left"
              ></button>

              <button
                class="forecast-button-scroll forecast-button-right"
                type="button"
                aria-label="Scroll forecast right"
              ></button>
            </div>

            <div class="forecast-container-inner">
              <div class="forecast-hours-wrapper">
                <ul class="forecast-hours"></ul>
              </div>
            </div>

            <div class="scroll-bar-wrapper" aria-hidden="true">
              <div class="scroll-bar">
                <div class="scroll-thumb"></div>
              </div>
            </div>
          </div>

          <div class="chart-button-container chart-button-show-container">
            <button
              class="button-show-chart"
              type="button"
              aria-controls="forecast-charts"
            >
              Show Chart
            </button>

            <div class="icon-container" aria-hidden="true">
              <img
                class="button-chart-icon"
                src="data:image/svg+xml,%3csvg%20width='6'%20height='10'%20viewBox='0%200%206%2010'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M0.530273%200.530273L4.53027%204.53027L0.530273%208.53027'%20stroke='white'%20stroke-width='1.5'/%3e%3c/svg%3e"
                alt=""
              />
            </div>
          </div>

          <div class="forecast-chart-container" id="forecast-charts">
            <div class="chart-button-container chart-button-hide-container">
              <button
                class="button-hide-chart"
                type="button"
                aria-controls="forecast-charts"
              >
                Hide Chart
              </button>

              <div class="icon-container" aria-hidden="true">
                <img
                  class="button-chart-icon button-chart-icon-up"
                  src="data:image/svg+xml,%3csvg%20width='6'%20height='10'%20viewBox='0%200%206%2010'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M0.530273%200.530273L4.53027%204.53027L0.530273%208.53027'%20stroke='white'%20stroke-width='1.5'/%3e%3c/svg%3e"
                  alt=""
                />
              </div>
            </div>

            <div class="charts-container">
              <canvas
                id="chart-temp"
                class="forecast-chart"
                role="img"
                aria-label="Temperature forecast chart"
              ></canvas>

              <canvas
                id="chart-humidity"
                class="forecast-chart"
                role="img"
                aria-label="Humidity forecast chart"
              ></canvas>

              <canvas
                id="chart-wind"
                class="forecast-chart"
                role="img"
                aria-label="Wind speed forecast chart"
              ></canvas>

              <canvas
                id="chart-pressure"
                class="forecast-chart"
                role="img"
                aria-label="Atmospheric pressure forecast chart"
              ></canvas>
            </div>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
